[project]
name = "xiaoyuzhou"
version = "0.1.0"
description = "Xiaoyuzhou FM CLI — agent-friendly, composable, clean."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "huangchenxi" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
xyz = "xiaoyuzhou.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xiaoyuzhou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
